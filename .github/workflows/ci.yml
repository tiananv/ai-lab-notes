name: Check notebook and kits
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UV_CACHE_DIR: .cache/uv
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run pytest
      - run: make results
      - run: git diff --exit-code -- README.md
