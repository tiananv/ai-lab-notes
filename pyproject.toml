[project]
name = "ai-lab-notes"
version = "0.1.0"
description = "An empty lab notebook with reproducible BA experiment kits."
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "openpyxl>=3.1,<4",
  "pypdf>=5,<7",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false
cache-dir = ".cache/uv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --basetemp=.cache/pytest"
